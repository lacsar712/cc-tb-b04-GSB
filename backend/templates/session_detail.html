{% extends "base.html" %}
{% block body %}
<h2>{{ item.name }}</h2>
<p>计划 {{ item.planned_pots }} 壶 · 发起人 {{ item.created_by }} · 受邀审评员：{{ invitees | join("、") }}</p>
{% if can_submit %}
<form method="post" action="{{ url_for('create_session_cupping', session_id=item.id) }}" data-swap="1">
  <h2>交一笔会内评</h2>
  <input name="aroma" type="number" step="0.1" min="0" max="10" placeholder="香气" required />
  <input name="taste" type="number" step="0.1" min="0" max="10" placeholder="滋味" required />
  <input name="liquor" type="number" step="0.1" min="0" max="10" placeholder="汤色" required />
  <button>提交</button>
</form>
{% endif %}
<table>
  <thead><tr><th>壶</th><th>审评员</th><th>加权分</th><th>结论</th><th>说明</th></tr></thead>
  <tbody id="rows">
    {% for row in rows %}{% include "_session_row.html" %}{% endfor %}
  </tbody>
</table>
{% endblock %}
