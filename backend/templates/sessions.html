{% extends "base.html" %}
{% block body %}
{% if can_write %}
<form method="post" action="{{ url_for('session_create') }}">
  <h2>开一场拼配试饮会</h2>
  <input name="name" placeholder="会名" required />
  <input name="planned_pots" type="number" step="1" min="1" placeholder="计划壶数" required />
  <input name="invites" placeholder="邀请审评员（逗号分隔）" required />
  <button>建会</button>
</form>
{% endif %}
<table>
  <thead><tr><th>会名</th><th>计划壶数</th><th>已交</th><th>建会人</th></tr></thead>
  <tbody>
    {% for s in sessions %}
    <tr>
      <td><a href="{{ url_for('session_detail', sid=s.id) }}">{{ s.name }}</a></td>
      <td>{{ s.planned_pots }}</td>
      <td>{{ s.submitted }}</td>
      <td>{{ s.created_by }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
